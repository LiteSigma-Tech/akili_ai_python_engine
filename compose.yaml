# Stack on the shared Trivia host; owns the network the API stack joins. Published only on the
# docker0 gateway. Defaults are prod; dev passes `--env-file .env --env-file stack.env`.
services:
  engine:
    build: .
    image: xeliai-engine:${IMAGE_TAG:-latest}
    container_name: xeliai_engine${STACK_SUFFIX:-}
    restart: always
    mem_limit: 768m
    env_file: .env
    environment:
      POSTGRES_HOST: xeliai_vectordb${STACK_SUFFIX:-}
      POSTGRES_PORT: "5432"
      WEB_CONCURRENCY: ${ENGINE_WORKERS:-2}
    volumes:
      - ./logs:/app/logs
    ports:
      - "172.17.0.1:${ENGINE_PORT:-8092}:8000"
    depends_on:
      vectordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}
    networks:
      - xeliai_app

  vectordb:
    image: pgvector/pgvector:pg16
    container_name: xeliai_vectordb${STACK_SUFFIX:-}
    restart: always
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - vectordb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "3"}
    networks:
      - xeliai_app

networks:
  xeliai_app:
    name: ${APP_NETWORK:-xeliai_app}
    driver: bridge

volumes:
  vectordb_data:
